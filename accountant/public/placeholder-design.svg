<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="p-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="p-thread" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark container background -->
  <rect width="400" height="400" rx="36" fill="url(#p-bg)" />
  <rect width="392" height="392" x="4" y="4" rx="32" fill="none" stroke="url(#p-gold)" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="6 4" />

  <!-- Embroidery Hoop -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="url(#p-gold)" stroke-width="8" stroke-dasharray="6 5" opacity="0.9" />
  <circle cx="200" cy="180" r="100" fill="#0b0f19" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />

  <!-- Fabric Texture grid lines inside hoop -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="120" y1="140" x2="280" y2="140" />
    <line x1="110" y1="180" x2="290" y2="180" />
    <line x1="120" y1="220" x2="280" y2="220" />
    <line x1="160" y1="100" x2="160" y2="260" />
    <line x1="200" y1="90" x2="200" y2="270" />
    <line x1="240" y1="100" x2="240" y2="260" />
  </g>

  <!-- Embroidery thread motif (floral swirl) -->
  <path d="M150 200 C150 140, 200 120, 230 145 C255 165, 245 210, 210 215 C175 220, 170 260, 240 240" 
        fill="none" stroke="url(#p-thread)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Needle with gold tip -->
  <g transform="rotate(35 210 160)">
    <path d="M207 90 L213 90 L211 200 L209 200 Z" fill="url(#p-gold)" filter="url(#p-glow)" />
    <ellipse cx="210" cy="102" rx="1.5" ry="5" fill="#0f172a" />
  </g>

  <!-- Hoop Tightener Screw at top -->
  <rect x="185" y="55" width="30" height="12" rx="3" fill="url(#p-gold)" />
  <rect x="195" y="47" width="10" height="8" rx="2" fill="#d97706" />

  <!-- Bottom Labels -->
  <text x="200" y="325" font-family="'Outfit', -apple-system, sans-serif" font-weight="800" font-size="22" fill="url(#p-gold)" text-anchor="middle" letter-spacing="3">CJS DESIGNS</text>
  <text x="200" y="352" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="2">EMBROIDERY CRAFT</text>
</svg>
