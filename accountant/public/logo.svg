<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Embroidery hoop circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold-grad)" stroke-width="12" stroke-dasharray="8 6" opacity="0.85" />
  <circle cx="256" cy="256" r="160" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="2" />

  <!-- Embroidery Needle & Thread loop -->
  <path d="M170 340 C170 200, 240 130, 320 170 C370 195, 360 270, 290 280 C210 290, 210 370, 340 340" 
        fill="none" stroke="url(#emerald-grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Needle -->
  <g transform="rotate(45 280 180)">
    <path d="M276 100 L284 100 L282 240 L278 240 Z" fill="url(#gold-grad)" filter="url(#glow)" />
    <!-- Needle eye -->
    <ellipse cx="280" cy="115" rx="2" ry="7" fill="#0b0f19" />
  </g>

  <!-- Monogram text CJS -->
  <text x="256" y="270" font-family="'Outfit', sans-serif" font-weight="800" font-size="74" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="4">CJS</text>
  <text x="256" y="305" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="20" fill="#94a3b8" text-anchor="middle" letter-spacing="6">DESIGNS</text>
</svg>
